<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wiki-masters — ménage de collection</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>Ménage de collection</h1>
  <span class="stat" id="stat-total"></span>
  <input id="search" type="search" placeholder="Filtrer par titre ou catégorie…" />
  <select id="origin-filter" title="Filtrer par origine">
    <option value="tous">Toutes origines</option>
    <option value="france">🇫🇷 France seulement</option>
    <option value="etranger">🌍 Étranger seulement</option>
    <option value="inconnu">Origine inconnue</option>
  </select>
  <select id="country-filter" title="Filtrer par pays">
    <option value="tous">Tous pays</option>
  </select>
  <select id="sort-order" title="Ordre des cartes dans chaque thème">
    <option value="q_score">Tri : notoriété (q_score)</option>
    <option value="keep_asc">Tri : à défausser d'abord</option>
    <option value="keep_desc">Tri : à garder d'abord</option>
  </select>
  <span class="threshold" title="Sélectionne les cartes visibles (filtres appliqués) dont le score de conservation est sous ce seuil. Ne défausse rien : la défausse passe toujours par le bouton et sa confirmation.">
    <label for="threshold">Score &lt;</label>
    <input id="threshold" type="number" min="0" max="100" step="5" value="30" />
    <button id="btn-select-below" type="button">Sélectionner</button>
  </span>
  <div class="header-actions">
    <button id="btn-reload">Recharger</button>
  </div>
</header>

<main id="main">
  <p class="empty-note">Chargement…</p>
</main>

<div class="selection-bar" id="selection-bar" style="display:none">
  <span class="count" id="selection-count">0 sélectionnée(s)</span>
  <button id="btn-clear">Tout désélectionner</button>
  <span class="spacer"></span>
  <button class="danger" id="btn-discard" disabled>Défausser la sélection</button>
</div>

<script src="app.js"></script>
</body>
</html>
